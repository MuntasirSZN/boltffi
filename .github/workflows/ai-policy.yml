name: AI Policy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  commit-attribution:
    name: Commit Attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: .github/scripts/check-ai-attribution.sh "$BASE_REVISION" "$HEAD_REVISION"
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
